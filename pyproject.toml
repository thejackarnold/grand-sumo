[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grand-sumo"
version = "0.4.0"
description = "Grand Sumo data client and Obsidian vault exporter"
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27",
    "pydantic>=2.0",
    "anyio>=4.0",
    "certifi",
    "pandas",
]

[project.scripts]
sumo = "grand_sumo.ui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/grand_sumo"]
